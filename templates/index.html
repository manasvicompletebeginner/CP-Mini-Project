<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Expense Splitter</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <button type="button" class="brand" data-goto="home">
      <span class="logo">₹</span> Expense Splitter
    </button>
    <div id="user-chip" class="user-chip hidden">
      <span id="user-name"></span>
      <button id="logout-btn" class="link-btn" type="button">Switch student</button>
    </div>
  </header>

  <!-- ============ LOGIN ============ -->
  <main id="login-screen" class="screen narrow">
    <section class="card">
      <h1>Split bills with your batch</h1>
      <p class="muted">Enter a username to continue. Open another browser tab to act as a different student.</p>
      <form id="login-form" class="stack">
        <label>Username
          <input id="login-username" name="username" placeholder="e.g. riya_22" autocomplete="off" required>
        </label>
        <button class="btn primary" type="submit">Continue</button>
      </form>
    </section>
  </main>

  <!-- ============ APP ============ -->
  <main id="app-screen" class="screen hidden">
    <div id="back-bar" class="back-bar hidden">
      <button class="btn back-btn" type="button" data-goto="home">← Back to Home</button>
    </div>

    <!-- HOME -->
    <section id="tab-home" class="tab-panel">
      <div class="actions">
        <button class="action-card" data-goto="create">
          <span class="action-icon">＋</span><strong>Create Room</strong><span>You paid? Split it.</span>
        </button>
        <button class="action-card" data-goto="join">
          <span class="action-icon">⇢</span><strong>Join Room</strong><span>Got a code? Pay your share.</span>
        </button>
        <button class="action-card" data-goto="previous">
          <span class="action-icon">↺</span><strong>Previous Rooms</strong><span>Track past expenses.</span>
        </button>
      </div>

      <div class="section-head">
        <h2>My Rooms</h2>
        <label class="toggle">
          <input type="checkbox" id="owner-only">
          <span>Only rooms I own</span>
        </label>
      </div>
      <div id="my-rooms" class="room-grid"></div>
    </section>

    <!-- CREATE -->
    <section id="tab-create" class="tab-panel hidden">
      <div class="two-col">
        <form id="create-form" class="card stack">
          <h2>Create a room</h2>
          <label>Room name <span class="muted">(optional)</span>
            <input name="room_name" maxlength="40" placeholder="Leave blank for Room #N">
          </label>
          <label>Activity
            <input name="activity" maxlength="40" placeholder="Dinner at Haldiram's" required>
          </label>
          <div class="row">
            <label>Date
              <input name="date" type="date" required>
            </label>
            <label>Total amount (₹)
              <input name="total_amount" type="number" min="1" step="0.01" placeholder="1500" required>
            </label>
          </div>
          <label>Total people <span class="muted">(including you)</span>
            <input name="total_people" type="number" min="2" max="50" value="4" required>
          </label>

          <fieldset class="split">
            <legend>Split type</legend>
            <label class="radio"><input type="radio" name="split_type" value="equal" checked> Equal</label>
            <label class="radio"><input type="radio" name="split_type" value="custom"> Custom</label>
          </fieldset>
          <label id="custom-wrap" class="hidden">Shares for others, in join order (₹, comma-separated)
            <input name="custom_shares" placeholder="400, 350, 350">
          </label>
          <p id="split-preview" class="preview"></p>

          <button class="btn primary" type="submit">Create room</button>
        </form>

        <div id="create-result" class="card result hidden"></div>
      </div>
    </section>

    <!-- JOIN -->
    <section id="tab-join" class="tab-panel hidden">
      <div class="two-col">
        <form id="join-form" class="card stack">
          <h2>Join a room</h2>
          <label>Room code
            <input id="join-code" name="code" maxlength="6" placeholder="A1B2C3" class="code-input" autocomplete="off" required>
          </label>
          <button class="btn primary" type="submit">Find room</button>
        </form>
        <div id="join-result" class="card result hidden"></div>
      </div>
    </section>

    <!-- PREVIOUS -->
    <section id="tab-previous" class="tab-panel hidden">
      <div class="section-head">
        <h2>Previous Rooms</h2>
        <a id="csv-link" class="btn" href="#" download>Download CSV</a>
      </div>
      <div id="stats" class="stats"></div>
      <div class="card chart-card">
        <img id="chart-img" alt="Chart of past spending by activity and by month">
      </div>
      <div id="activity-table"></div>
      <div id="previous-rooms" class="room-grid"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
